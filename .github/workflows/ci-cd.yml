# HustleHub+ CI/CD pipeline
#
# Runs on every push and pull request. Any failing test, lint error, security
# finding or broken container fails the run (and therefore blocks a merge).
#
#   backend ─┐
#   frontend ┼─► docker (build → Trivy → compose up → smoke → Newman → ZAP) ─► publish (main only)
#   api-tests┤
#   security ┘   (npm audit, Semgrep SAST, Gitleaks)          + CodeQL in codeql.yml
#
# Repository settings used by the publish job (optional - it is skipped without them):
#   Variables:  DOCKERHUB_USERNAME (e.g. evanildo1997)
#   Secrets:    DOCKERHUB_TOKEN    (Docker Hub access token, Read & Write)

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------
  backend:
    name: Backend · lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      mongo:
        image: mongo:7.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Static code analysis (ESLint + eslint-plugin-security)
        run: npm run lint
      - name: Save ESLint report (evidence)
        if: always()
        run: npx eslint . --format json --output-file eslint-report.json || true
      - name: Unit and integration tests (Vitest + Supertest + MongoDB)
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml
      - name: Upload backend results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-results
          path: |
            api/test-results/
            api/eslint-report.json

  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend · lint + tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Static code analysis (oxlint)
        run: npm run lint
      - name: Component tests (Vitest + Testing Library)
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml
      - name: Production build
        run: npm run build
      - name: Upload frontend results and build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-results
          path: |
            client/test-results/
            client/dist/

  # ---------------------------------------------------------------------------
  api-tests:
    name: API endpoint tests · Newman
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: api
    services:
      mongo:
        image: mongo:7.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Create a throw-away environment (random secrets per run)
        run: |
          {
            echo "PORT=5000"
            echo "NODE_ENV=production"
            echo "MONGO_URI=mongodb://127.0.0.1:27017/hustlehub_ci"
            echo "JWT_SECRET=$(openssl rand -hex 48)"
            echo "CORS_ORIGIN=https://localhost:5173"
            echo "ADMIN_NAME=CI Admin"
            echo "ADMIN_EMAIL=admin@ci.hustlehub.local"
            echo "ADMIN_PASSWORD=Ci-$(openssl rand -hex 8)-Aa1!"
          } > .env
      - name: Generate TLS certificate and seed the admin
        run: |
          npm run generate-cert
          npm run seed:admin
      - name: Start the API over HTTPS
        run: |
          nohup npm start > api-stdout.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsk https://localhost:5000/api/health && exit 0
            sleep 2
          done
          echo "API did not become healthy"; cat api-stdout.log; exit 1
      - name: Run the Postman collection with Newman
        run: npm run test:api
      - name: Upload Newman reports and API logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-reports
          path: |
            api/postman/reports/
            api/src/logs/events.log

  # ---------------------------------------------------------------------------
  security:
    name: Security scans · audit + SAST + secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history, so the secret scan covers every commit.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Dependency audit - API (fails on high/critical in production deps)
        working-directory: api
        run: npm audit --omit=dev --audit-level=high
      - name: Dependency audit - client
        working-directory: client
        run: npm audit --omit=dev --audit-level=high
      - name: SAST - Semgrep (JavaScript, Node, Express, React, OWASP Top 10, secrets, Dockerfile)
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.110.0 semgrep scan \
            --config p/javascript --config p/nodejs --config p/expressjs --config p/react \
            --config p/owasp-top-ten --config p/secrets --config p/dockerfile \
            --exclude node_modules --exclude docs --exclude '*.test.js' --exclude '*.test.jsx' \
            --metrics off --error --sarif --output semgrep.sarif
      - name: Secret scanning - Gitleaks (whole git history)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.0 git /repo \
            --redact --no-banner --report-format json --report-path /repo/gitleaks-report.json
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            semgrep.sarif
            gitleaks-report.json

  # ---------------------------------------------------------------------------
  docker:
    name: Docker · build, scan, run full stack, DAST
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Create compose environment (random secrets per run)
        run: |
          ADMIN_PASSWORD="Ci-$(openssl rand -hex 8)-Aa1!"
          {
            echo "JWT_SECRET=$(openssl rand -hex 48)"
            echo "ADMIN_EMAIL=admin@ci.hustlehub.local"
            echo "ADMIN_PASSWORD=${ADMIN_PASSWORD}"
            echo "IMAGE_TAG=ci"
          } > .env
          echo "::add-mask::${ADMIN_PASSWORD}"
          echo "ADMIN_EMAIL=admin@ci.hustlehub.local" >> "$GITHUB_ENV"
          echo "ADMIN_PASSWORD=${ADMIN_PASSWORD}" >> "$GITHUB_ENV"
      - name: Build both images
        run: docker compose build
      - name: Image vulnerability scan - Trivy (fails on fixable HIGH/CRITICAL)
        run: |
          for image in evanildo1997/hustlehub-api:ci evanildo1997/hustlehub-client:ci; do
            echo "::group::Trivy $image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.69.3 image \
              --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
            echo "::endgroup::"
          done
      - name: Start the stack (MongoDB + API + client) and wait for health checks
        run: |
          docker compose up -d --wait --wait-timeout 180
          docker compose ps
      - name: Smoke tests through nginx
        run: |
          set -e
          curl -fsk https://localhost:8443/api/health
          curl -fsk https://localhost:8443/ | grep -q '<div id="root">'
          curl -fsk -o /dev/null https://localhost:8443/earnings          # SPA route fallback
          curl -sk -D - -o /dev/null https://localhost:8443/ | grep -qi "content-security-policy: default-src 'self'"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = "301"   # HTTP -> HTTPS
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:8443/.env)" = "404"
      - name: Seed the admin inside the API container
        run: docker compose exec -T api node scripts/seedAdmin.js
      - name: Newman against the containerised stack
        working-directory: api
        run: |
          npm ci
          BASE_URL=https://localhost:8443 node scripts/runNewman.js
      - name: DAST - OWASP ZAP baseline scan
        run: |
          mkdir -p zap && cp .zap/rules.tsv zap/
          docker run --rm --network hustlehub_frontend -v "$PWD/zap:/zap/wrk:rw" -u root \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t https://client:8443 \
            -c rules.tsv -r zap-report.html -J zap-report.json -I
      - name: Collect container logs (logging evidence)
        if: always()
        run: |
          mkdir -p container-logs
          docker compose ps > container-logs/compose-ps.txt || true
          docker compose logs --no-color > container-logs/compose.log 2>&1 || true
          docker compose exec -T api cat src/logs/events.log > container-logs/api-events.log 2>/dev/null || true
      - name: Upload Docker job evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-evidence
          path: |
            container-logs/
            zap/
            api/postman/reports/
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  publish:
    name: Deliver · push images to Docker Hub
    runs-on: ubuntu-latest
    needs: [backend, frontend, api-tests, security, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      HAS_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip when Docker Hub is not configured
        if: env.DOCKERHUB_USERNAME == '' || env.HAS_TOKEN != 'true'
        run: echo "::notice::DOCKERHUB_USERNAME variable / DOCKERHUB_TOKEN secret not set - images were built and tested but not published."
      - uses: docker/setup-buildx-action@v3
        if: env.DOCKERHUB_USERNAME != '' && env.HAS_TOKEN == 'true'
      - uses: docker/login-action@v4
        if: env.DOCKERHUB_USERNAME != '' && env.HAS_TOKEN == 'true'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push API image
        if: env.DOCKERHUB_USERNAME != '' && env.HAS_TOKEN == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/hustlehub-api:latest
            ${{ vars.DOCKERHUB_USERNAME }}/hustlehub-api:sha-${{ github.sha }}
      - name: Push client image
        if: env.DOCKERHUB_USERNAME != '' && env.HAS_TOKEN == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/hustlehub-client:latest
            ${{ vars.DOCKERHUB_USERNAME }}/hustlehub-client:sha-${{ github.sha }}
