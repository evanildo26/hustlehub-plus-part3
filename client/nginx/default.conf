# HustleHub+ web server (nginx, unprivileged container).

server_tokens off;   # Don't advertise the nginx version.

# Defence in depth in front of the API's own rate limiters: at most 20
# requests/second per client IP to /api, with a short burst allowance.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_status 429;

# Plain HTTP only redirects to HTTPS. The target host is fixed rather than
# taken from the request's Host header, which an attacker controls -
# otherwise a forged Host could turn this into an open redirect (Semgrep:
# request-host-used). A real deployment sets its own domain here.
server {
    listen 8080;
    server_name localhost;
    return 301 https://localhost:8443$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /tmp/nginx-certs/cert.pem;
    ssl_certificate_key /tmp/nginx-certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    root /usr/share/nginx/html;
    client_max_body_size 16k;   # The API accepts 10 kB JSON bodies; nothing bigger needs to get through.

    # Container health check (no logging, no app involvement).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Same-origin API proxy: the browser only ever talks to this server, so
    # the CSP can stay at connect-src 'self'. The upstream TLS certificate is
    # VERIFIED against the API's own certificate (shared read-only volume).
    location ^~ /api/ {   # ^~ : regex locations below are never consulted for /api
        limit_req zone=api burst=40 nodelay;

        proxy_pass https://api:5000;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/nginx/api-certs/cert.pem;
        proxy_ssl_name api;
        proxy_ssl_server_name on;

        proxy_set_header Host api;                                    # Fixed upstream host, never the client's Host header.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # Real client IP for the API's per-IP limits (TRUST_PROXY=1).
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $request_id;                    # Same id in nginx and API logs.
        proxy_read_timeout 30s;
        # No add_header here: the API's own (stricter) security headers pass through unchanged.
    }

    # Fingerprinted build assets: cache for a year.
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The app's HTML (also what "/" and every client-side route resolve to)
    # is never stored by browsers or proxies, so a new deployment is picked up at once.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Paths that look like files (robots.txt, sitemap.xml, .env, ...) are served
    # only if they exist - never answered with the app's HTML.
    location ~ \.[A-Za-z0-9]+$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;   # Tiny files (robots.txt, favicon) - not worth caching.
        try_files $uri =404;
    }

    # Single-page app: other unknown paths serve index.html so client-side
    # routes work on reload. The HTML is never stored by browsers or proxies.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri /index.html;
    }
}
